name: Check free website build
on:
  push:
    branches: [codex/ai-studio-import]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cloudflare-pages-build
          path: |
            out/
            .next/pages-build-report.json
          retention-days: 7
